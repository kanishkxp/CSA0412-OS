# /etc/nginx/sites-available/result-portal
upstream portal_app {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name result.simats.example;
    return 301 https://$host$request_uri;      # send everyone to HTTPS
}

server {
    listen 443 ssl;
    server_name result.simats.example;
    ssl_certificate     /etc/ssl/result/fullchain.pem;
    ssl_certificate_key /etc/ssl/result/privkey.pem;

    location / {
        proxy_pass http://portal_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
